<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>跑友赛历</title>
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("scoutTheme");
      const theme =
        param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-link: #4da6ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel: rgba(41, 41, 41, 0.72);
      --cp-panel-strong: rgba(41, 41, 41, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.04);
      --cp-highlight: rgba(253, 142, 161, 0.12);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      background: var(--cp-bg);
      color: var(--cp-text);
      font: 16px/1.6 "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont,
        "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    button, a { -webkit-tap-highlight-color: var(--cp-accent-soft); }
    button { font: inherit; cursor: pointer; }
    a { color: var(--cp-accent); text-underline-offset: 3px; }
    :focus-visible { outline: 2px solid var(--cp-accent); outline-offset: 3px; }
    ::selection { background: var(--cp-highlight); }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 30px; line-height: 1.35; font-weight: 650; }
    h2 { font-size: 22px; line-height: 1.4; }
    h3 { font-size: 20px; line-height: 1.45; }
    .shell { width: min(1120px, calc(100% - 48px)); margin: auto; padding-bottom: calc(32px + env(safe-area-inset-bottom)); }
    .site-header, .section-heading, .heading-actions, .profile-hero, .id-row {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    .site-header { padding: 24px 0 32px; }
    .brand { font-size: 20px; font-weight: 650; }
    .muted { color: var(--cp-text-muted); }
    html[data-theme="dark"] .muted { color: var(--cp-text-soft); }
    .small { font-size: 14px; }
    .button {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 44px; padding: 10px 14px; border: 1px solid var(--cp-border);
      border-radius: 10px; background: var(--cp-surface); color: var(--cp-text);
      font-size: 14px; font-weight: 500; line-height: 1.4; text-decoration: none;
    }
    .button:hover { background: var(--cp-accent-soft); border-color: var(--cp-accent); }
    .button-primary { background: var(--cp-accent); color: var(--cp-accent-fg); border-color: var(--cp-accent); }
    .button-primary:hover { background: var(--cp-accent-hover); }
    .member-picker { position: relative; flex-shrink: 0; }
    .member-toggle { width: 84px; padding: 8px; gap: 6px; color: var(--cp-accent); }
    .avatar { display: block; flex-shrink: 0; object-fit: cover; width: 32px; height: 32px; border-radius: 8px; }
    .current-avatar { width: 24px; height: 24px; border-radius: 6px; }
    .avatar-initial { display: inline-flex; align-items: center; justify-content: center; background: var(--cp-accent-soft); color: var(--cp-accent); }
    .member-menu {
      position: absolute; z-index: 20; top: calc(100% + 8px); right: 0;
      width: 212px; max-height: min(480px, calc(100vh - 120px)); overflow-y: auto;
      border: 1px solid var(--cp-border); border-radius: 10px; background: var(--cp-surface);
      overscroll-behavior: contain;
    }
    .member-option {
      display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px;
      padding: 8px 12px; border: 0; border-bottom: 1px solid var(--cp-border);
      background: var(--cp-surface); color: var(--cp-text); text-align: left; font-size: 14px;
    }
    .member-option:last-child { border-bottom: 0; }
    .member-option:hover, .member-option[aria-checked="true"] { background: var(--cp-accent-soft); }
    .member-current { margin-left: auto; color: var(--cp-accent); font-size: 12px; }
    .section-heading { margin: 8px 0 24px; }
    .heading-actions { flex-shrink: 0; gap: 12px; }
    .race-grid, .result-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
    .card { border: 1px solid var(--cp-border); border-radius: 16px; background: var(--cp-surface); }
    .race-card, .result-card { min-width: 0; padding: 24px; }
    .race-header, .race-body, .race-status, .result-main, .ranking-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .race-header { font-size: 14px; font-variant-numeric: tabular-nums; }
    .race-status { justify-content: flex-start; gap: 6px; white-space: nowrap; }
    .status-dot { width: 7px; height: 7px; flex-shrink: 0; border-radius: 50%; }
    .status-confirmed { background: var(--cp-success); }
    .status-pending { background: var(--cp-link); }
    .status-waitlist { background: var(--cp-warning); }
    .race-body { margin: 20px 0; }
    .race-info { min-width: 0; flex: 1; overflow-wrap: anywhere; }
    .race-category { margin-top: 8px; font-size: 14px; }
    .countdown { min-width: 70px; margin-left: 8px; text-align: right; color: var(--cp-accent); flex-shrink: 0; }
    .countdown-value { display: block; font-size: 36px; line-height: 1.1; font-weight: 650; font-variant-numeric: tabular-nums; }
    .countdown-label { display: block; margin-top: 8px; font-size: 12px; }
    .countdown-past { color: var(--cp-text-soft); }
    .countdown-today .countdown-value { font-size: 26px; }
    .race-footer, .result-footer { display: flex; flex-wrap: wrap; gap: 8px 16px; padding-top: 12px; border-top: 1px solid var(--cp-border); font-size: 14px; }
    .empty-state { max-width: 600px; margin: 0 auto; padding: 24px 32px 32px; }
    .empty-map svg { display: block; width: 100%; max-width: 440px; height: auto; margin: 0 auto 24px; }
    .empty-state p { margin-top: 12px; }
    .page-note { margin-top: 32px; font-size: 12px; text-align: center; }
    .page-note p + p { margin-top: 4px; }
    .profile-hero { justify-content: flex-start; margin-bottom: 24px; }
    .profile-avatar { width: 64px; height: 64px; border-radius: 16px; }
    .id-row { justify-content: flex-start; margin: 20px 0; }
    .itra-id { display: block; font: 600 22px/1.5 Consolas, "Courier New", Courier, monospace; user-select: all; }
    .coverage-summary { margin-bottom: 20px; font-size: 14px; }
    .score-panel { display: grid; grid-template-columns: 1fr 2fr; gap: 32px; padding: 28px; }
    .index-row { display: flex; align-items: baseline; flex-wrap: wrap; gap: 16px; margin: 8px 0; }
    .performance-index { color: var(--cp-accent); font-size: 56px; font-weight: 650; line-height: 1.15; }
    .stats-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
    .stat-value { display: block; margin-bottom: 4px; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .stat-unit { margin-left: 4px; font-size: 12px; font-weight: 400; }
    .record-note { margin-top: 20px; font-size: 13px; }
    .endurance-section { margin: 24px 0 32px; }
    .endurance-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .endurance-item { padding: 6px 12px; background: var(--cp-accent-soft); border-radius: 8px; font-size: 14px; }
    .results-heading { margin-top: 32px; }
    .result-main { align-items: flex-start; margin: 12px 0; gap: 20px; }
    .result-name { flex: 1; min-width: 0; font-size: 17px; overflow-wrap: anywhere; }
    .result-score { flex-shrink: 0; text-align: right; }
    .result-score-value { display: block; color: var(--cp-accent); font-size: 28px; line-height: 1.2; font-weight: 600; }
    .result-score .small { font-size: 12px; }
    .result-detail { margin-bottom: 12px; font-size: 14px; }
    .result-footer { font-size: 13px; }
    .coverage-notice { margin-top: 20px; padding: 16px 20px; border-radius: 10px; background: var(--cp-accent-soft); font-size: 14px; }
    .coverage-title { display: block; margin-bottom: 4px; }
    .ranking-section { margin-top: 40px; }
    .ranking-section > p { margin: 8px 0 16px; }
    .ranking-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 32px; padding: 0 24px; }
    .ranking-row { padding: 16px 0; border-bottom: 1px solid var(--cp-border); }
    .ranking-row:last-child { border-bottom: 0; }
    .ranking-numbers { text-align: right; font-variant-numeric: tabular-nums; }
    .ranking-value { font-weight: 600; }
    .error-panel { padding: 24px; }
    .error-panel p { margin: 12px 0 20px; }
    .toast { position: fixed; z-index: 40; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translateX(-50%); max-width: calc(100% - 32px); padding: 12px 20px; border-radius: 10px; background: var(--cp-text); color: var(--cp-surface); font-size: 14px; text-align: center; }
    .clipboard-helper { position: fixed; left: -9999px; top: 0; }
    @media (min-width: 1080px) {
      .race-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 700px) {
      .shell { width: calc(100% - 32px); }
      .site-header { padding: 20px 0 24px; }
      h1 { font-size: 24px; }
      h2 { font-size: 20px; }
      .race-grid, .result-grid, .ranking-list { grid-template-columns: minmax(0, 1fr); }
      .race-card, .result-card { padding: 20px; }
      .score-panel { grid-template-columns: minmax(0, 1fr); gap: 24px; padding: 24px; }
      .stats-grid { padding-top: 20px; border-top: 1px solid var(--cp-border); }
      .empty-state { padding: 20px; }
      .section-heading { gap: 8px; }
      .heading-actions { gap: 8px; }
      #profile-link { padding: 8px 10px; font-size: 13px; }
      .ranking-list { padding: 0 20px; }
      .ranking-row { gap: 16px; }
    }
    @media (max-width: 360px) {
      #calendar-title { font-size: 21px; }
      .race-card, .result-card, .score-panel { padding: 16px; }
      .heading-actions .small { font-size: 12px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header id="home-header" class="site-header">
      <div><div class="brand">跑友赛历</div><p class="muted small">下一场，一起出发。</p></div>
      <div class="member-picker" id="member-picker">

          <h2>下一场，还在路上</h2>
          <p class="muted">表中暂时没有这位跑友的中签、待抽签或候补记录。</p>

        <footer class="page-note muted">
          <p>CSV 赛历快照，非实时同步</p>
          <p id="calendar-clock"></p>
          <p>只看中了、待抽签与候补的赛事</p>
        </footer>
      </section>

      <section id="profile-page" aria-labelledby="profile-name" hidden>
        <div class="profile-hero">
          <img id="profile-avatar" class="avatar profile-avatar" alt="">
          <div><h1 id="profile-name"></h1><p class="muted small">ITRA 越野档案</p></div>
        </div>
        <div id="profile-empty" class="card empty-state" hidden>
          <h2>ITRA 资料尚未录入</h2>
          <p class="muted">这位跑友的资料准备好后，会显示在这里。</p>
        </div>
        <div id="profile-content">
          <div class="id-row">
            <div><div class="muted small">ITRA ID</div><output id="itra-id" class="itra-id"></output></div>
            <button id="copy-id" class="button button-primary" aria-label="复制数字 ITRA ID">复制 ID</button>
          </div>
          <p id="coverage-summary" class="coverage-summary muted"></p>
          <div class="card score-panel">
            <div>
              <p class="muted small">ITRA 总表现分</p>
              <div class="index-row"><span id="performance-index" class="performance-index"></span><span id="index-level" class="muted small"></span></div>
              <p class="muted small">General Performance Index</p>
              <p id="record-note" class="record-note muted"></p>
            </div>
            <div id="stats-grid" class="stats-grid"></div>
          </div>
          <section id="endurance-section" class="endurance-section">
            <p class="muted small">耐力积分分布，与表现分不同</p>
            <div id="endurance-list" class="endurance-list"></div>
          </section>
          <section aria-labelledby="history-title">
            <div class="section-heading results-heading">
              <h2 id="history-title">历史比赛</h2>
              <span id="history-count" class="muted small"></span>
            </div>
            <div id="history-grid" class="result-grid"></div>
            <aside id="coverage-notice" class="coverage-notice">
              <strong id="coverage-title" class="coverage-title"></strong>
              <p id="coverage-explanation"></p>
            </aside>
          </section>
          <section id="ranking-section" class="ranking-section" aria-labelledby="ranking-title">
            <h2 id="ranking-title">表现分排名</h2>
            <p class="muted small">按网站所示范围与组别标注</p>
            <div id="ranking-list" class="card ranking-list"></div>
          </section>
          <footer class="page-note muted">
            <p id="profile-source"></p>
            <p>本地资料快照，非实时查询</p>
          </footer>
        </div>
      </section>
      <section id="error-panel" class="card error-panel" role="alert" hidden>
        <h1>暂时无法显示内容</h1>
        <p id="error-message"></p>
        <a id="reset-link" class="button" href="#">返回赛历</a>
      </section>
    </main>

        const DAY_MS = 24 * 60 * 60 * 1000;
const BEIJING_OFFSET_MS = 8 * 60 * 60 * 1000;
const INCLUDED_STATUSES = ["中了", "待抽签", "候补"];
const STATUS_CLASSES = { "中了": "confirmed", "待抽签": "pending", "候补": "waitlist" };
const RESULT_STATUS_LABELS = { DNF: "未完赛", DNS: "未出发", DSQ: "取消资格", DQ: "取消资格", OTL: "超时" };

function beijingTimestamp(now) {
  const value = now.getTime();
  if (!Number.isFinite(value)) throw new Error("当前日期无效，请检查设备时间。");
  return value + BEIJING_OFFSET_MS;
}

function raceDay(date) {
  if (typeof date !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(date)) {
    throw new Error("赛事日期格式有误，请检查 CSV 数据。");
  }
  const [year, month, day] = date.split("-").map(Number);
  const value = new Date(Date.UTC(year, month - 1, day));
  if (value.getUTCFullYear() !== year || value.getUTCMonth() !== month - 1 ||
      value.getUTCDate() !== day) {
    throw new Error("赛事日期无效，请检查 CSV 数据。");
  }
  return value.getTime() / DAY_MS;
}

function daysUntil(date, now = new Date()) {
  return raceDay(date) - Math.floor(beijingTimestamp(now) / DAY_MS);
}

function beijingDate(now = new Date()) {
  return new Date(beijingTimestamp(now)).toISOString().slice(0, 10);
}

function millisecondsUntilNextDay(now = new Date()) {
  return DAY_MS - (beijingTimestamp(now) % DAY_MS);
}

function getMemberRaces(data, member, now = new Date()) {
  if (!data.members.some((item) => item.name === member)) {
    throw new Error("这个视角不在成员名单里，请重新选择。");
  }
  const today = Math.floor(beijingTimestamp(now) / DAY_MS);
  return data.races
    .filter((race) => INCLUDED_STATUSES.includes(race.participants[member]))
    .slice()
    .sort((left, right) => left.date.localeCompare(right.date) ||
      (left.time || "99:99").localeCompare(right.time || "99:99") ||
      left.id.localeCompare(right.id))
    .map((race) => {
      const remainingDays = raceDay(race.date) - today;
      const status = race.participants[member];
      return {
        id: race.id,
        name: race.name,
        date: race.date,
        timeLabel: race.time || "时间待定",
        location: race.location,
        type: race.type,
        groupLabel: /^\d+(\.\d+)?$/.test(race.group) ? `${race.group} km` : race.group,
        status,
        statusClass: STATUS_CLASSES[status],
        remainingDays,
        countdownValue: remainingDays === 0 ? "今天" : String(Math.abs(remainingDays)),
        countdownLabel: remainingDays > 0 ? "天后开跑" : remainingDays < 0 ? "天前比赛" : "比赛日",
        countdownClass: remainingDays < 0 ? "past" : remainingDays === 0 ? "today" : "upcoming"
      };
    });
}

function hasProfile(itra, memberName) {
  return itra.profiles.some((profile) => profile.member === memberName);
}

function numberLabel(value) {
  return String(value).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}

function getProfileView(calendar, itra, name) {
  const member = calendar.members.find((item) => item.name === name);
  if (!member) throw new Error("未找到这位跑友，请返回赛历重新选择。");
  const profile = itra.profiles.find((item) => item.member === name) || null;
  const view = {
    member, profile, results: [], rankings: [], endurance: [],
    missingResults: 0, finishedResultCount: 0, dnfCount: 0,
    elevationLabel: "", isPartial: false, loadError: "",
    coverageTitle: "", coverageSummary: "", historyCountLabel: "",
    coverageExplanation: "本页来自网站可见的近期记录，完整历史尚未验证。DNF 不计入完赛数量；未提供的总名次不会用分组名次代替。"
  };
  if (!profile) return view;
  const finishedResultCount = profile.results.filter((result) => result.status === "FINISHED").length;
  const dnfCount = profile.results.filter((result) => result.status === "DNF").length;
  const missingResults = profile.finishedRaces - finishedResultCount;
  if (missingResults < 0) throw new Error("完赛记录数量与汇总不一致，请检查资料。");
  return {
    ...view,
    missingResults,
    finishedResultCount,
    dnfCount,
    isPartial: profile.coverage === "partial",
    coverageTitle: missingResults ? `还有 ${missingResults} 场完赛记录待补充` : "完整历史尚未确认",
    coverageSummary: `完赛记录已收录 ${finishedResultCount} / ${profile.finishedRaces} 场` +
      (dnfCount ? `，另有 ${dnfCount} 条 DNF` : "") + "，暂非完整历史",
    historyCountLabel: `${profile.results.length} 条记录`,
    elevationLabel: numberLabel(profile.totalElevationM),
    results: profile.results.map((result) => {
      const nonFinishLabel = RESULT_STATUS_LABELS[result.status];
      const detail = [`${result.distanceKm} km`, `+${numberLabel(result.elevationM)} m`];
      if (result.time !== null) detail.push(result.time);
      return {
        ...result,
        scoreLabel: nonFinishLabel ? result.status : result.score === null ? "未提供" : String(result.score),
        scoreCaption: nonFinishLabel || "单场表现分",
        detailLabel: detail.join(" / "),
        enduranceLabel: result.endurancePoints === null ? "耐力积分未提供" : `耐力积分 ${result.endurancePoints}`,
        elevationLabel: numberLabel(result.elevationM),
        genderRankLabel: result.genderRank === null ? (nonFinishLabel ? "无完赛名次" : "组别名次未提供") :
          `${result.genderGroup}第 ${numberLabel(result.genderRank)} 名`,
        overallRankLabel: result.overallRank === null ? "" :
          `总名次 ${numberLabel(result.overallRank)}`
      };
    }),
    rankings: profile.rankings.map((ranking) => ({
      ...ranking,
      key: `${ranking.scope}-${ranking.group}`,
      rankLabel: numberLabel(ranking.rank),
      totalLabel: numberLabel(ranking.total)
    })),
    endurance: profile.endurance.filter((item) => item.count > 0)
  };
}

function getNumericItraId(profile) {

  if (typeof identifier !== "string" || !/^\d+$/.test(identifier)) {
    throw new Error("暂时没有可复制的 ITRA ID");
  }
  return identifier;
}

        const image = node("img", className);
        if (!data.assets[member.avatar]) throw new Error("头像数据缺失，请重新生成网页。");
        image.src = data.assets[member.avatar];
        image.alt = "";
        return image;
      }

      function setAvatar(id, member) {
        const previous = $(id);
        const replacement = avatar(member, previous.className);
        replacement.id = id;
        previous.replaceWith(replacement);
      }

      function routeHash(view, member) {
        return "#" + new URLSearchParams({ view, member }).toString();
      }

      function notify(message) {
        clearTimeout(toastTimer);
        $("toast").textContent = message;
        $("toast").hidden = false;
        toastTimer = setTimeout(() => { $("toast").hidden = true; }, 3500);
      }

      function closeMenu(restoreFocus = false) {
        $("member-menu").hidden = true;
        $("member-toggle").setAttribute("aria-expanded", "false");
        if (restoreFocus) $("member-toggle").focus();
      }

      function openMenu() {
        $("member-menu").hidden = false;
        $("member-toggle").setAttribute("aria-expanded", "true");
        const selected = $("member-menu").querySelector('[aria-checked="true"]');
        if (selected) selected.focus();
      }

      function renderMenu() {
        const buttons = data.calendar.members.map((member) => {
          const button = node("button", "member-option");
          button.type = "button";
          button.setAttribute("role", "menuitemradio");
          button.setAttribute("aria-checked", String(member.name === currentMember));
          button.append(avatar(member, "avatar"), node("span", "", member.name));
          if (member.name === currentMember) button.append(node("span", "member-current", "当前"));
          button.addEventListener("click", () => {
            closeMenu(true);
            const hash = routeHash("calendar", member.name);
            if (location.hash === hash) renderRoute();
            else location.replace(hash);
          });
          return button;
        });
        $("member-menu").replaceChildren(...buttons);
      }

      function raceCard(race) {
        const card = node("article", "card race-card");
        card.dataset.raceId = race.id;
        const header = node("div", "race-header muted");
        const date = node("time", "", race.date);
        date.dateTime = race.date;
        const status = node("div", "race-status");
        const dot = node("span", "status-dot status-" + race.statusClass);
        dot.setAttribute("aria-hidden", "true");
        status.append(dot, node("span", "", race.status));
        header.append(date, status);
        const body = node("div", "race-body");
        const info = node("div", "race-info");
        info.append(node("h3", "", race.name), node("p", "race-category muted", `${race.type} / ${race.groupLabel}`));
        const countdown = node("div", "countdown countdown-" + race.countdownClass);
        countdown.append(node("span", "countdown-value", race.countdownValue),
          node("span", "countdown-label muted", race.countdownLabel));
        body.append(info, countdown);
        const footer = node("div", "race-footer muted");
        footer.append(node("span", "", race.location), node("span", "", race.timeLabel));
        card.append(header, body, footer);
        return card;
      }

      function renderCalendar(memberName) {
        const races = model.getMemberRaces(data.calendar, memberName);
        const member = data.calendar.members.find((item) => item.name === memberName);
        setAvatar("current-avatar", member);
        $("current-name").textContent = member.name;
        $("member-toggle").setAttribute("aria-label", `当前视角${member.name}，点击切换跑友`);
        $("calendar-title").textContent = `${member.name}的赛历`;
        $("race-count").textContent = `${races.length} 场`;
        $("profile-link").hidden = !model.hasProfile(data.itra, member.name);
        $("profile-link").href = routeHash("profile", member.name);
        $("calendar-grid").replaceChildren(...races.map(raceCard));
        $("calendar-empty").hidden = races.length !== 0;
        $("calendar-clock").textContent = `北京时间 ${model.beijingDate()} · 按自然日倒计时`;
        renderMenu();
      }

      function resultCard(result) {
        const card = node("article", "card result-card");
        card.append(node("time", "muted small", result.date));
        const main = node("div", "result-main");
        const score = node("div", "result-score");
        score.append(node("span", "result-score-value", result.scoreLabel), node("span", "muted small", result.scoreCaption));
        main.append(node("h3", "result-name", result.name), score);
        const detail = node("p", "result-detail muted", result.detailLabel);
        const footer = node("div", "result-footer muted");
        footer.append(node("span", "", result.genderRankLabel));
        if (result.overallRankLabel) footer.append(node("span", "", result.overallRankLabel));
        footer.append(node("span", "", result.enduranceLabel));
        card.append(main, detail, footer);
        return card;
      }

      function renderProfile(memberName) {
        const view = model.getProfileView(data.calendar, data.itra, memberName);
        const profile = view.profile;
        currentProfile = profile;
        setAvatar("profile-avatar", view.member);
        $("profile-name").textContent = view.member.name;
        $("back-link").href = routeHash("calendar", view.member.name);
        $("profile-empty").hidden = Boolean(profile);
        $("profile-content").hidden = !profile;
        if (!profile) return;
        $("itra-id").textContent = model.getNumericItraId(profile);
        $("performance-index").textContent = profile.performanceIndex;
        $("index-level").textContent = profile.indexLevel;
        $("record-note").textContent = `单场最高 ${profile.bestScore} 分 / 最长 ${profile.longestDistanceKm} km`;
        $("coverage-summary").hidden = !view.isPartial;
        $("coverage-summary").textContent = view.coverageSummary;
        const stats = [
          [profile.finishedRaces, "场", "累计完赛"],
          [profile.totalDistanceKm, "km", "累计距离"],
          [view.elevationLabel, "m", "累计爬升"],
          [profile.totalTime, "", "累计比赛用时"]
        ];
        $("stats-grid").replaceChildren(...stats.map(([value, unit, label]) => {
          const cell = node("div", "stat");
          const display = node("span", "stat-value", value);
          if (unit) display.append(node("span", "stat-unit", unit));
          cell.append(display, node("span", "muted small", label));
          return cell;
        }));
        $("endurance-section").hidden = view.endurance.length === 0;
        $("endurance-list").replaceChildren(...view.endurance.map((item) =>
          node("span", "endurance-item", `${item.points} 分 × ${item.count} 场`)));
        $("history-count").textContent = view.historyCountLabel;
        $("history-grid").replaceChildren(...view.results.map(resultCard));
        $("coverage-notice").hidden = !view.isPartial;
        $("coverage-title").textContent = view.coverageTitle;
        $("coverage-explanation").textContent = view.coverageExplanation;
        $("ranking-section").hidden = view.rankings.length === 0;
        $("ranking-list").replaceChildren(...view.rankings.map((ranking) => {
          const row = node("div", "ranking-row");
          const scope = node("div");
          scope.append(node("div", "", ranking.scope), node("div", "muted small", ranking.group));
          const numbers = node("div", "ranking-numbers");
          numbers.append(node("div", "ranking-value", ranking.rankLabel),
            node("div", "muted small", `/ ${ranking.totalLabel} 人`));
          row.append(scope, numbers);
          return row;
        }));
        $("profile-source").textContent = `数据来源 ITRA / 采集于 ${profile.checkedOn}`;
      }

      function scheduleDayRefresh() {
        clearTimeout(dayTimer);
        if (document.hidden) return;
        dayTimer = setTimeout(() => {
          if (currentView === "calendar") renderCalendar(currentMember);
          scheduleDayRefresh();
        }, model.millisecondsUntilNextDay() + 100);
      }

      function renderRoute() {
        closeMenu();
        try {
          const params = new URLSearchParams(location.hash.slice(1));
          const view = params.get("view") || "calendar";
          const memberName = params.get("member") || data.calendar.members[0].name;
          if (!["calendar", "profile"].includes(view)) throw new Error("页面链接无效，请返回赛历。");
          currentMember = memberName;
          currentView = view;
          currentProfile = null;
          if (view === "profile") renderProfile(memberName);
          else renderCalendar(memberName);
          $("home-header").hidden = view !== "calendar";
          $("profile-header").hidden = view !== "profile";
          $("calendar-page").hidden = view !== "calendar";
          $("profile-page").hidden = view !== "profile";
          $("error-panel").hidden = true;
          document.title = view === "profile" ? `${memberName} · ITRA 个人页` : `${memberName}的赛历`;
          scheduleDayRefresh();
        } catch (error) {
          console.error("Unable to display the requested view:", error);
          $("calendar-page").hidden = true;
          $("profile-page").hidden = true;
          $("error-panel").hidden = false;
          $("error-message").textContent = error.message;
          $("reset-link").href = routeHash("calendar", data.calendar.members[0].name);
        }
      }

      function legacyCopy(value) {
        const field = node("textarea", "clipboard-helper");
        field.value = value;
        field.readOnly = true;
        document.body.append(field);
        field.select();
        try {
          return document.execCommand("copy");
        } finally {
          field.remove();
          $("copy-id").focus();
        }
      }

      $("copy-id").addEventListener("click", async () => {
        try {
          const identifier = model.getNumericItraId(currentProfile);
          let copied = false;
          if (navigator.clipboard && navigator.clipboard.writeText) {
            try {
              await navigator.clipboard.writeText(identifier);
              copied = true;
            } catch (error) {
              if (!["NotAllowedError", "SecurityError", "NotSupportedError"].includes(error.name)) throw error;
              console.warn("Clipboard permission unavailable; trying local-file copy.", error.name);
            }
          }
          if (!copied) copied = legacyCopy(identifier);
          if (!copied) throw new Error("浏览器未允许复制，请选中上方数字 ID 手动复制。");
          notify("ITRA ID 已复制");
        } catch (error) {
          console.error("Unable to copy ITRA ID:", error);
          notify(error.message || "复制失败，请选中数字 ID 手动复制。");
        }
      });

      $("member-toggle").addEventListener("click", () => {
        if ($("member-menu").hidden) openMenu();
        else closeMenu(true);
      });
      document.addEventListener("click", (event) => {
        if (!$("member-picker").contains(event.target)) closeMenu();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !$("member-menu").hidden) closeMenu(true);
      });
      $("member-menu").addEventListener("keydown", (event) => {
        const buttons = Array.from($("member-menu").querySelectorAll("button"));
        const index = buttons.indexOf(document.activeElement);
        let next;
        if (event.key === "ArrowDown") next = (index + 1) % buttons.length;
        else if (event.key === "ArrowUp") next = (index - 1 + buttons.length) % buttons.length;
        else if (event.key === "Home") next = 0;
        else if (event.key === "End") next = buttons.length - 1;
        else return;
        event.preventDefault();
        buttons[next].focus();
      });
      window.addEventListener("hashchange", () => {
        renderRoute();
        window.scrollTo(0, 0);
      });
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) renderRoute();
        else clearTimeout(dayTimer);
      });
      renderRoute();
    })();
  </script>
</body>
</html>
